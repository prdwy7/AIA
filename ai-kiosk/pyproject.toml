[project]
name = "ai-kiosk"
version = "0.1.0"
description = "AI-Enabled Agricultural Advisory Kiosk — implementation monorepo (KVK Banavasi)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "canonical-schema",
    "agri-rules",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "services/*",
]

[tool.uv.sources]
canonical-schema = { workspace = true }
agri-rules = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
asyncio_mode = "auto"
