    name: "Gemma 3 12B (Q5_K_M)"
    class: LLM+VLM
    license: "Gemma Terms of Use"
    deploy: "Edge (Ollama 0.34.x)"
    purpose: "Advisory drafting, structured observations"
    source: "ollama library: gemma3:12b (Q5_K_M)"
    card: cards/gemma-3-12b.md
    status_at_m1: "Baseline benchmark"

