# ASR chain (user-specified primary + fallback) — docs/05 §2
asr_chain:
  - priority: 1
    role: primary
    model_id: ASR-0.1.0
    when: "default; quality-first path"
  - priority: 2
    role: fast_fallback
    model_id: ASR-0.1.1
    when: "utterance ≤ 3 s and GPU free; GPU busy with LLM/vision; latency budget tight"
  - priority: 3
    role: online_cross_check
    model_id: BHASHINI-ASR
    when: "online AND (confidence < 0.60 OR cross-check of low-confidence transcript)"
    note: "disagreement on a critical entity → confirmation gate showing both candidates"

tts_chain:
  - priority: 1
    model_id: TTS-0.1.0
    note: "default, offline, sub-second on CPU"
  - priority: 2
    model_id: TTS-0.2.0
    note: "online, higher quality"
  - priority: 3
    model_id: null
    note: "text-only display (screen always shows the full answer)"

# Selection gate (docs/05 §4): the primary model must beat the alternative by the
# framework-defined margin on the KVK-curated evaluation sets (docs/05 §5) or be
# swapped — the architecture is model-agnostic by design.
