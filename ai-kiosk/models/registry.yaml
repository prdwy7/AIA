# AI Kiosk v2 — Model registry (docs/05-models.md §1; roadmap §5.3)
#
# Machine-readable catalog of every model in the system. Baseline pins: Sep 2026.
# All pins live in lockfiles and Dockerfile tags; upgrades follow the release
# framework (roadmap §4.5) with regression gates.
#
# Conventions:
# - `id` is the logical version used in the version tuple (MODEL_VERSION etc.).
# - `artifact` is content-addressed (SHA-256) + signed; the version registry
#   (db: version_registry) maps logical versions to artifact digests.
# - `card` links to the per-model card in models/cards/.
# - `status_at_m1` is the Phase-1/5 model-selection gate state (docs/05 §4).

version: "1.0.0"
baseline: "2026-09"

models:
