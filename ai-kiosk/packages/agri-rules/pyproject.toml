[project]
name = "agri-rules"
version = "1.0.0"
description = "Deterministic agricultural rules engine — regulatory (PPQS/CIB&RC), dose, PHI/PPE, weather-window, confidence gates. The LLM cannot override these rules."
requires-python = ">=3.12"
dependencies = [
    "canonical-schema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agri_rules"]
