[project]
name = "canonical-schema"
version = "1.0.0"
description = "Canonical multimodal case schema (CST) — Pydantic v2 models for the AI Kiosk v2 case graph, knowledge, rules, learning, devices and API contracts"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "python-ulid>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canonical_schema"]
