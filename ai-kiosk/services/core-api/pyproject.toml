[project]
name = "core-api"
version = "0.1.0"
description = "AI Kiosk central API — sessions, cases, inputs (docs/04 §1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "canonical-schema",
    "agri-rules",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core_api"]

[tool.uv.sources]
canonical-schema = { workspace = true }
agri-rules = { workspace = true }
