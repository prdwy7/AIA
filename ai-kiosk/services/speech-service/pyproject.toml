[project]
name = "speech-service"
version = "0.1.0"
description = "AI Kiosk voice pipeline — ASR chain (Vaani-Whisper primary, SraVaani fast fallback, BHASHINI cross-check) + TTS (docs/05 §2)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "httpx>=0.28",
    "canonical-schema",
]

[project.optional-dependencies]
# Heavy runtimes are optional: the service degrades gracefully (engine
# availability is probed at runtime) and tests run without them.
asr = ["faster-whisper>=1.0", "onnxruntime>=1.18", "huggingface_hub>=0.25"]
tts = ["piper-tts>=1.2"]
dev = ["pytest>=8.3", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speech_service"]

[tool.uv.sources]
canonical-schema = { workspace = true }
