[project]
name = "sync-agent"
version = "0.1.0"
description = "AI Kiosk sync-agent — encrypted, idempotent, resumable synchronization (edge + central peer). (docs/02 S19)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "httpx>=0.28",
    "canonical-schema",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sync_agent"]

[tool.uv.sources]
canonical-schema = { workspace = true }
