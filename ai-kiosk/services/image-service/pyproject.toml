[project]
name = "image-service"
version = "0.1.0"
description = "AI Kiosk image evidence pipeline — quality checks, Gemma 3 vision observations, ViT classifier, media sets (docs/02 S6)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "httpx>=0.28",
    "pillow>=10.0",
    "canonical-schema",
]

[project.optional-dependencies]
# Heavy runtimes are optional; the service degrades gracefully.
vision = ["torch>=2.2", "timm>=1.0"]  # ViT classifier (ONNX export in prod)
dev = ["pytest>=8.3", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_service"]

[tool.uv.sources]
canonical-schema = { workspace = true }
